# Publishes ./site to Cloudflare Pages (project "glowlab") on every push to main.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare account ID
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        run: |
          node build/tests/pro_worker_test.mjs site/_worker.js
          node build/tests/stream_test.mjs site/_worker.js
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secret CLOUDFLARE_API_TOKEN is missing (Settings -> Secrets and variables -> Actions)"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing (Settings -> Secrets and variables -> Actions)"; exit 1; fi
          set -o pipefail
          if ! npx --yes wrangler@4 pages deploy site --project-name=glowlab --branch=main --commit-dirty=true 2>&1 | tee wrangler.txt; then
            grep -E "ERROR|✘|\[code|Authentication|not found|permission|Unauthorized|denied" wrangler.txt | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
